name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'     # weekly, catches new numpy/Python releases

jobs:
  locked:
    # Environment pinned by uv.lock (dev group). The lock covers Python < 3.13, see pyproject.toml.
    name: locked, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest -q

  compat:
    # Isolated environments with an exact numpy: the oldest with wheels for each Python
    # and the newest release ('latest'). Windows covers the int32/int64 default integer.
    # The full matrix is run locally by scripts/compat_matrix.py, see DEV.md.
    name: ${{ matrix.os }}, Python ${{ matrix.python }}, numpy ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  python: '3.9',  numpy: '1.23.3'}
          - {os: ubuntu-latest,  python: '3.9',  numpy: 'latest'}
          - {os: ubuntu-latest,  python: '3.10', numpy: '1.23.3'}
          - {os: ubuntu-latest,  python: '3.10', numpy: 'latest'}
          - {os: ubuntu-latest,  python: '3.11', numpy: '1.23.3'}
          - {os: ubuntu-latest,  python: '3.11', numpy: 'latest'}
          - {os: ubuntu-latest,  python: '3.12', numpy: '1.26.4'}
          - {os: ubuntu-latest,  python: '3.12', numpy: 'latest'}
          - {os: ubuntu-latest,  python: '3.13', numpy: '2.1.3'}
          - {os: ubuntu-latest,  python: '3.13', numpy: 'latest'}
          - {os: ubuntu-latest,  python: '3.14', numpy: '2.3.5'}
          - {os: ubuntu-latest,  python: '3.14', numpy: 'latest'}
          - {os: windows-latest, python: '3.9',  numpy: '1.23.3'}
          - {os: windows-latest, python: '3.14', numpy: 'latest'}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.numpy }}" = "latest" ]; then NUMPY="numpy"; else NUMPY="numpy==${{ matrix.numpy }}"; fi
          uv run --no-project --isolated --python ${{ matrix.python }} \
            --no-build-package numpy --no-build-package scipy \
            --with "$NUMPY" --with pytest --with scipy --with-editable . \
            python -c "import sys, numpy; print('Python', sys.version.split()[0], 'numpy', numpy.__version__)"
          uv run --no-project --isolated --python ${{ matrix.python }} \
            --no-build-package numpy --no-build-package scipy \
            --with "$NUMPY" --with pytest --with scipy --with-editable . \
            pytest -q -p no:cacheprovider
