[project]
name = "spinwaves"
version = "0.2.0"
description = "Linear spin wave theory in python as in SpinW"
authors = [
    { name = "Michal Stekiel", email = "michal.stekiel@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.23.5",
    "scipy==1.9.1",
]

[project.optional-dependencies]
# Plotting and GUI: `spinwaves.plotting`, `spinwaves.gui`, `Group` network plots
graphics = [
    "matplotlib==3.5.2",
    "vispy==0.12.1",
    "pyqt6>=6.10.2",
    "pyqtgraph>=0.13.7",
    "pyopengl>=3.1.10",
    "networkx>=3.4.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "lmfit>=1.3.2",
    "pandas>=1.4.4",
    "sphinx>=5.0.2",
]
# Mirrors the `graphics` extra for `uv sync --group graphics`
graphics = [
    "spinwaves[graphics]",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spinwaves"
module-root = ""
